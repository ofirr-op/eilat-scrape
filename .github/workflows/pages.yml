# Rebuild the price page when a scrape commits status or results.
# The early "scan is running" commit is deployed from here, because a
# workflow can upload only one Pages artifact and the scrape workflow
# uses that slot for the finished run.

name: Publish price page

on:
  push:
    branches: [main]
    paths:
      - output/status.json
      - output/history/**
      - output/eilat/**
      - site/**
      - scrape/site_data.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the price page
        run: |
          set -euo pipefail
          python -m scrape.site_data build --root . --dest site/data.json
          test -s site/index.html
          test -s site/data.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
